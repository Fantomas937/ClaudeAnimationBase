<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kali Linux promo</title>
<style>
  @font-face { font-family: 'Orbitron'; src: url(fonts/orbitron-latin-900-normal.woff2) format('woff2'); font-weight: 900; }
  @font-face { font-family: 'Orbitron'; src: url(fonts/orbitron-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Chakra Petch'; src: url(fonts/chakra-petch-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Chakra Petch'; src: url(fonts/chakra-petch-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  html, body { margin: 0; background: #05070c; color: #dde; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 120px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="24.5" step="0.0333" value="0"><span id="tt">loading…</span></div>
</main>
<!-- the soundtrack's timeline (generated by audio/music.py), the logo, the engine, then the shots -->
<script src="cues.js"></script>
<script src="logo.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
</body>
</html>
